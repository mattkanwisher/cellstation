# pacman.conf for omarchy-cm5 — the aarch64 counterpart of upstream's
# default/pacman/pacman-stable.conf. Differences from upstream, all forced by
# the architecture (not preferences):
#   - Arch Linux ARM mirrorlist + keyring instead of x86 Arch
#   - no [multilib] (32-bit x86 libs; doesn't exist on ALARM)
#   - [alarm] and [aur] repos that ALARM provides
#   - [omarchy] points at OUR aarch64 package repo (same /stable/$arch layout
#     as pkgs.omarchy.org, so upstream's channel tooling keeps working)

[options]
Color
ILoveCandy
VerbosePkgLists
HoldPkg = pacman glibc
Architecture = aarch64
CheckSpace
ParallelDownloads = 5

SigLevel = Required DatabaseOptional
LocalFileSigLevel = Optional

[core]
Include = /etc/pacman.d/mirrorlist

[extra]
Include = /etc/pacman.d/mirrorlist

[alarm]
Include = /etc/pacman.d/mirrorlist

[aur]
Include = /etc/pacman.d/mirrorlist

[omarchy]
SigLevel = Optional TrustAll
# TODO: stand up the aarch64 package repo (see pkgs/README.md) and point
# this at its public URL, keeping the /stable/$arch path shape.
Server = https://pkgs.example.tensorfleet.dev/omarchy/stable/$arch
